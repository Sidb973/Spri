<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mid-Term Sprint</title>
<meta name="description" content="Exam-sprint tracker: countdown, per-topic confidence, study timer and a repeating weekly plan.">
<meta name="theme-color" content="#E6E7E2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sprint">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>html,body{margin:0;padding:0;background:#E6E7E2}
@media (prefers-color-scheme: dark){html,body{background:#101216}}</style>
</head>
<body>
<style>
/* ============================================================
   Mid-Term Sprint — Term VII
   Single self-contained file. No external requests.
   ============================================================ */

:root {
  --ground:      #E6E7E2;
  --surface:     #FAFAF7;
  --surface-2:   #EFF0EB;
  --ink:         #14161A;
  --ink-2:       #565A63;
  --ink-3:       #8A8F99;
  --rule:        #C9CBC4;
  --rule-soft:   #DCDDD7;
  --chip-bg:     #14161A;
  --chip-fg:     #FAFAF7;
  --shaky:       #A8341C;
  --mid:         #8A6410;
  --ready:       #136251;
  --shaky-wash:  #F4E4E0;
  --mid-wash:    #F3EBDA;
  --ready-wash:  #DDEBE6;
  --shadow:      0 1px 2px rgba(20,22,26,.06), 0 6px 18px rgba(20,22,26,.05);

  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Roboto, sans-serif;

  --gutter: 58px;
  --maxw: 880px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --ground:     #101216;
    --surface:    #181B21;
    --surface-2:  #1F232A;
    --ink:        #EDEEE9;
    --ink-2:      #9AA0AA;
    --ink-3:      #6B717B;
    --rule:       #2C3038;
    --rule-soft:  #22262C;
    --chip-bg:    #EDEEE9;
    --chip-fg:    #101216;
    --shaky:      #E4674A;
    --mid:        #D9A03C;
    --ready:      #3FAE92;
    --shaky-wash: #2E1C18;
    --mid-wash:   #2B2318;
    --ready-wash: #14261F;
    --shadow:     0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
  }
}

:root[data-theme="dark"] {
  --ground:#101216; --surface:#181B21; --surface-2:#1F232A;
  --ink:#EDEEE9; --ink-2:#9AA0AA; --ink-3:#6B717B;
  --rule:#2C3038; --rule-soft:#22262C;
  --chip-bg:#EDEEE9; --chip-fg:#101216;
  --shaky:#E4674A; --mid:#D9A03C; --ready:#3FAE92;
  --shaky-wash:#2E1C18; --mid-wash:#2B2318; --ready-wash:#14261F;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px rgba(0,0,0,.3);
}
:root[data-theme="light"] {
  --ground:#E6E7E2; --surface:#FAFAF7; --surface-2:#EFF0EB;
  --ink:#14161A; --ink-2:#565A63; --ink-3:#8A8F99;
  --rule:#C9CBC4; --rule-soft:#DCDDD7;
  --chip-bg:#14161A; --chip-fg:#FAFAF7;
  --shaky:#A8341C; --mid:#8A6410; --ready:#136251;
  --shaky-wash:#F4E4E0; --mid-wash:#F3EBDA; --ready-wash:#DDEBE6;
  --shadow:0 1px 2px rgba(20,22,26,.06), 0 6px 18px rgba(20,22,26,.05);
}

* { box-sizing: border-box; }

.st {
  background: var(--ground);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.5;
  margin: 0;
  min-height: 100vh;
  padding-bottom: 108px;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
.st button, .st input, .st select, .st textarea { font: inherit; color: inherit; }
.st :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; border-radius: 2px; }

.wrap { max-width: var(--maxw); margin: 0 auto; padding: 0 16px; }

/* ---------- board header ---------- */
.board {
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 14px 0 13px;
}
.board-in {
  max-width: var(--maxw); margin: 0 auto; padding: 0 16px;
  display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center;
}
.board-label {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px;
}
.board-time {
  font-family: var(--mono); font-weight: 700; font-size: clamp(26px, 8vw, 40px);
  letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums;
  display: block;
}
.board-for {
  font-size: 12.5px; color: var(--ink-2); margin-top: 5px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.board.live .board-time { color: var(--shaky); }

.ring { display: block; }
.ring-track { stroke: var(--rule); }
.ring-fill  { stroke: var(--ready); transition: stroke-dashoffset .5s cubic-bezier(.2,.7,.3,1); }
.ring-num {
  font-family: var(--mono); font-weight: 700; font-size: 15px;
  fill: var(--ink); font-variant-numeric: tabular-nums;
}
.ring-cap { font-family: var(--mono); font-size: 7px; fill: var(--ink-3); letter-spacing: .1em; }

.icon-btn {
  width: 44px; height: 44px; display: grid; place-items: center;
  background: none; border: 1px solid var(--rule); border-radius: 3px;
  cursor: pointer; color: var(--ink-2);
}
.icon-btn:hover { border-color: var(--ink); color: var(--ink); }

/* ---------- generic ---------- */
.eyebrow {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .16em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 12px; margin: 26px 0 11px;
}
.eyebrow::after { content:''; flex:1; height:1px; background: var(--rule); }
.eyebrow .ebtn {
  background: none; border: 1px solid var(--rule); border-radius: 2px;
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); padding: 6px 9px; cursor: pointer; order: 3;
}
.eyebrow .ebtn:hover { border-color: var(--ink); color: var(--ink); }

.card {
  background: var(--surface); border: 1px solid var(--rule);
  border-radius: 3px; box-shadow: var(--shadow);
}
.pad { padding: 15px 16px; }

.view { display: none; }
.view.on { display: block; }

.muted { color: var(--ink-2); font-size: 13.5px; }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }

/* ---------- date strip ---------- */
.strip-scroll {
  overflow-x: auto; overflow-y: hidden;
  scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch;
  margin: 0 -16px; padding: 2px 16px 10px;
}
.strip-scroll::-webkit-scrollbar { height: 0; }
.strip { display: flex; gap: 6px; }
.day {
  scroll-snap-align: center; flex: none;
  width: 54px; padding: 8px 4px 9px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
  text-align: center; cursor: pointer; position: relative;
}
.day:hover { border-color: var(--ink-2); }
.day-w {
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--ink-3);
}
.day-d {
  font-family: var(--mono); font-weight: 700; font-size: 17px;
  line-height: 1.25; font-variant-numeric: tabular-nums;
}
.day-m { font-family: var(--mono); font-size: 8.5px; letter-spacing: .08em; color: var(--ink-3); text-transform: uppercase; }
.day.sel { background: var(--chip-bg); border-color: var(--chip-bg); }
.day.sel .day-w, .day.sel .day-d, .day.sel .day-m { color: var(--chip-fg); }
.day.today:not(.sel) { border-color: var(--ink); border-width: 2px; }
.day-mark {
  position: absolute; left: 0; right: 0; bottom: 3px;
  display: flex; justify-content: center; gap: 3px; height: 4px;
}
.day-mark i { width: 4px; height: 4px; border-radius: 50%; display: block; }
.day-mark i.exam { background: var(--shaky); }
.day-mark i.gold { background: var(--mid); }
.day-mark i.dn   { background: var(--ready); }
.day.sel .day-mark i.exam { background: var(--chip-fg); }
.day.sel .day-mark i.gold { background: var(--chip-fg); }
.day.sel .day-mark i.dn   { background: var(--chip-fg); }

/* ---------- day header ---------- */
.dayhead {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 12px;
}
.dayhead h2 { font-size: 19px; font-weight: 700; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.badge {
  font-family: var(--mono); font-size: 9px; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; padding: 4px 7px; border-radius: 2px;
  background: var(--chip-bg); color: var(--chip-fg); white-space: nowrap;
}
.badge.gold { background: var(--mid-wash); color: var(--mid); border: 1px solid var(--mid); }
.badge.exam { background: var(--shaky-wash); color: var(--shaky); border: 1px solid var(--shaky); }

/* ---------- focus card ---------- */
.focus { border-left: 3px solid var(--shaky); }
.focus-line { font-size: 14px; margin-bottom: 12px; }
.focus-line b { font-weight: 700; }
.frow {
  display: grid; grid-template-columns: 1fr auto; gap: 8px 12px;
  align-items: center; padding: 9px 0; border-top: 1px solid var(--rule-soft);
}
.frow:first-of-type { border-top: none; }
.frow-name { font-size: 13.8px; }
.frow-sub { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; }

/* ---------- confidence pills ---------- */
.pills { display: flex; gap: 5px; }
.pill {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .05em; text-transform: uppercase;
  min-height: 30px; padding: 0 9px; border: 1px solid var(--rule); border-radius: 2px;
  background: var(--surface); color: var(--ink-3); cursor: pointer; white-space: nowrap;
}
.pill:hover { border-color: var(--ink-2); color: var(--ink-2); }
/* --chip-fg is near-white on the light ground and near-black on the dark one,
   which is the readable text colour over the semantic fills in both themes. */
.pill.on { color: var(--chip-fg); }
.pill.on[data-v="1"] { background: var(--shaky); border-color: var(--shaky); }
.pill.on[data-v="2"] { background: var(--mid);   border-color: var(--mid); }
.pill.on[data-v="3"] { background: var(--ready); border-color: var(--ready); }

/* ---------- timeline ---------- */
.tl { position: relative; }
.tl::before {
  content: ''; position: absolute; left: calc(var(--gutter) - 9px); top: 6px; bottom: 6px;
  width: 1px; background: var(--rule);
}
.blk {
  display: grid; grid-template-columns: var(--gutter) 1fr auto;
  gap: 0 12px; align-items: start; padding: 10px 0; position: relative;
}
.blk-t {
  font-family: var(--mono); font-size: 10.5px; font-weight: 500; color: var(--ink-2);
  letter-spacing: -.01em; padding-top: 2px; font-variant-numeric: tabular-nums;
}
.blk-t span { display: block; color: var(--ink-3); }
.blk::after {
  content: ''; position: absolute; left: calc(var(--gutter) - 12px); top: 16px;
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--surface); border: 1.5px solid var(--rule);
}
.blk-b { min-width: 0; }
.blk-name { font-size: 14px; }
.blk-sub {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .09em;
  text-transform: uppercase; color: var(--ink-3); margin-top: 3px;
  display: flex; align-items: center; gap: 7px; flex-wrap: wrap;
}
.blk.exam .blk-name { font-weight: 700; }
.blk.exam::after { background: var(--shaky); border-color: var(--shaky); }
.blk.now::after { background: var(--chip-bg); border-color: var(--chip-bg); width: 11px; height: 11px; left: calc(var(--gutter) - 14px); top: 14px; }
.blk.now .blk-name { font-weight: 600; }
.blk.past { opacity: .45; }
.blk.done .blk-name { text-decoration: line-through; color: var(--ink-3); }
.now-tag {
  font-family: var(--mono); font-size: 8.5px; font-weight: 700; letter-spacing: .14em;
  background: var(--chip-bg); color: var(--chip-fg); padding: 3px 5px; border-radius: 2px;
}
.blk-go {
  background: none; border: 1px solid var(--rule); border-radius: 2px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); min-height: 30px; padding: 0 8px; cursor: pointer; white-space: nowrap;
}
.blk-go:hover { border-color: var(--ink); color: var(--ink); }

/* ---------- checkbox ---------- */
.cbwrap {
  display: grid; place-items: center; width: 34px; height: 34px;
  margin: -8px 0 -8px -8px; flex: none; cursor: pointer;
}
.box {
  appearance: none; -webkit-appearance: none;
  width: 18px; height: 18px; flex: none; margin: 0;
  border: 1.5px solid var(--ink-2); background: var(--surface);
  cursor: pointer; position: relative; border-radius: 2px;
}
.box:checked { background: var(--ink); border-color: var(--ink); }
.box:checked::after {
  content: ''; position: absolute; left: 5.5px; top: 1.5px;
  width: 4px; height: 9px; border: solid var(--surface);
  border-width: 0 2px 2px 0; transform: rotate(43deg);
}

/* ---------- tasks ---------- */
.task {
  display: flex; align-items: flex-start; gap: 6px;
  padding: 7px 0; border-top: 1px solid var(--rule-soft);
}
.task:first-of-type { border-top: none; }
.task-text { flex: 1; font-size: 14px; padding-top: 6px; }
.task.done .task-text { color: var(--ink-3); text-decoration: line-through; }
.task-x {
  background: none; border: none; color: var(--ink-3); cursor: pointer;
  font-family: var(--mono); font-size: 15px; width: 32px; height: 32px; border-radius: 2px;
}
.task-x:hover { color: var(--shaky); }

/* ---------- habits ---------- */
.habits { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 4px; }
.habit {
  flex: 1; min-width: 92px; min-height: 46px;
  display: flex; align-items: center; justify-content: center; gap: 7px;
  background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
  font-family: var(--mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); cursor: pointer; padding: 0 8px;
}
.habit:hover { border-color: var(--ink-2); }
.habit.on { background: var(--ready-wash); border-color: var(--ready); color: var(--ready); }
.habit i { width: 7px; height: 7px; border-radius: 50%; background: var(--rule); display: block; }
.habit.on i { background: var(--ready); }

/* ---------- papers ---------- */
.paper { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; margin-bottom: 8px; box-shadow: var(--shadow); }
.paper-row {
  display: grid; grid-template-columns: 52px 1fr auto;
  align-items: center; gap: 13px; width: 100%;
  padding: 13px 14px; background: none; border: none; text-align: left; cursor: pointer;
}
.paper-row:hover { background: var(--surface-2); }
.p-date { font-family: var(--mono); font-size: 10.5px; font-weight: 700; letter-spacing: .04em; color: var(--ink-2); line-height: 1.35; }
.p-name { font-weight: 600; font-size: 15px; letter-spacing: -.01em; display: block; }
.p-meta { font-family: var(--mono); font-size: 9.5px; color: var(--ink-3); margin-top: 4px; display: block; letter-spacing: .03em; }
.p-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.segbar { display: flex; gap: 2px; }
.seg { width: 6px; height: 18px; background: var(--rule); border-radius: 1px; }
.seg.s1 { background: var(--shaky); } .seg.s2 { background: var(--mid); } .seg.s3 { background: var(--ready); }
.chev { font-family: var(--mono); color: var(--ink-3); font-size: 13px; transition: transform .2s; }
.paper.open .chev { transform: rotate(90deg); }
.paper.next { border-left: 3px solid var(--ink); }
.paper.next .p-date { color: var(--ink); }
.paper.sat { opacity: .55; }

.panel { display: none; padding: 2px 14px 16px; border-top: 1px solid var(--rule-soft); }
.paper.open .panel { display: block; }
.tip {
  background: var(--surface-2); border-radius: 3px; padding: 10px 12px;
  font-size: 13px; color: var(--ink-2); margin: 12px 0;
}
.tip b { color: var(--ink); font-weight: 600; }

.budget { margin: 12px 0 4px; }
.budget-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.budget-lab { font-family: var(--mono); font-size: 9.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); }
.budget-num { font-family: var(--mono); font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--rule-soft); border-radius: 3px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ready); border-radius: 3px; }
.bar i.over { background: var(--mid); }

.panel-head {
  font-family: var(--mono); font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-3); display: flex; justify-content: space-between; gap: 10px; padding: 12px 0 6px;
}
.topic {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center;
  gap: 4px 10px; padding: 6px 0; border-top: 1px solid var(--rule-soft);
}
.topic-name { font-size: 13.8px; min-width: 0; }
.topic.done .topic-name { color: var(--ink-3); }
.star { color: var(--mid); font-size: 11px; }
.topic-edit { display: flex; gap: 4px; grid-column: 2 / -1; }

.cases {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  margin-top: 14px; padding: 11px 13px; background: var(--surface-2); border-radius: 3px;
}
.cases-label { font-size: 13px; flex: 1; min-width: 160px; color: var(--ink-2); }
.cases-label b { color: var(--ink); font-weight: 600; }
.counter { display: flex; align-items: center; gap: 6px; }
.cbtn {
  width: 36px; height: 36px; border: 1px solid var(--rule); background: var(--surface);
  font-family: var(--mono); font-size: 16px; cursor: pointer; border-radius: 2px; color: var(--ink);
}
.cbtn:hover { border-color: var(--ink); }
.cnum { font-family: var(--mono); font-weight: 700; font-size: 16px; min-width: 26px; text-align: center; font-variant-numeric: tabular-nums; }

/* ---------- small buttons ---------- */
.mini {
  background: none; border: 1px solid var(--rule); border-radius: 2px;
  font-family: var(--mono); font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
  color: var(--ink-2); min-height: 30px; padding: 0 8px; cursor: pointer;
}
.mini:hover { border-color: var(--ink); color: var(--ink); }
.mini.danger:hover { border-color: var(--shaky); color: var(--shaky); }
.addrow { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }

/* ---------- plan ---------- */
.weekgrid { display: grid; gap: 6px; }
.weekrow {
  display: grid; grid-template-columns: 92px 1fr; gap: 10px; align-items: center;
  padding: 8px 12px; background: var(--surface); border: 1px solid var(--rule); border-radius: 3px;
}
.weekrow-d { font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.sel-t {
  width: 100%; min-height: 38px; background: var(--surface-2);
  border: 1px solid var(--rule); border-radius: 2px; padding: 0 8px; cursor: pointer;
}
.tmpl { margin-bottom: 10px; }
.tmpl-head {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  padding: 12px 14px; border-bottom: 1px solid var(--rule-soft);
}
.tmpl-name { font-weight: 600; font-size: 14.5px; flex: 1; }
.tmpl-body { padding: 4px 14px 14px; }

/* ---------- stats ---------- */
.stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--rule); border-radius: 3px; padding: 13px 14px; box-shadow: var(--shadow); }
.stat-l { font-family: var(--mono); font-size: 9px; letter-spacing: .13em; text-transform: uppercase; color: var(--ink-3); }
.stat-v { font-family: var(--mono); font-weight: 700; font-size: 25px; letter-spacing: -.03em; margin-top: 5px; font-variant-numeric: tabular-nums; }
.stat-s { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

.srow { padding: 11px 0; border-top: 1px solid var(--rule-soft); }
.srow:first-of-type { border-top: none; }
.srow-top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 6px; }
.srow-n { font-size: 13.8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.srow-v { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }

.spread { display: flex; height: 22px; border-radius: 2px; overflow: hidden; border: 1px solid var(--rule); }
.spread i { display: block; height: 100%; }
.spread i.c0 { background: var(--rule); }
.spread i.c1 { background: var(--shaky); }
.spread i.c2 { background: var(--mid); }

const OLD_KEY = 'midsem_tracker_v1';

let S = null;
let view = 'day';
let selDate = null;
let openId = null;
let editingSubject = null;

function freshState() {
  return {
    v: 2,
    subjects: SEED_SUBJECTS.map(s => ({
      id: s.id, name: s.name, date: s.date,
      examStart: s.examStart, examEnd: s.examEnd,
      level: s.level, budget: s.budget, note: s.note, why: s.why, aiTip: s.aiTip,
      topics: s.topics.map((t, i) => ({ id: 't' + i, name: t, star: (s.star || []).indexOf(i) >= 0 }))
    })),
    templates: JSON.parse(JSON.stringify(SEED_TEMPLATES)),
    week: Object.assign({}, SEED_WEEK),
    days: JSON.parse(JSON.stringify(SEED_DAYS)),
    conf: {}, done: {}, cases: {}, ticks: {},
    sessions: [], running: null, habits: {},
    ui: { theme: null }
  };
}

/* Works inside the Claude artifact sandbox and as a plain page. */
const store = {
  async get(k) {
    if (window.storage) {
      try { const r = await window.storage.get(k); return r ? r.value : null; } catch (e) {}
    }
    try { return localStorage.getItem(k); } catch (e) { return null; }
  },
  async set(k, v) {
    if (window.storage) {
      try { await window.storage.set(k, v); return true; } catch (e) {}
    }
    try { localStorage.setItem(k, v); return true; } catch (e) { return false; }
  }
};

let saveTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => store.set(KEY, JSON.stringify(S)), 250);
}

/* v1 → v2. Topic keys were subjectId#<index>; they are now subjectId#t<index>. */
function migrateV1(old) {
  const s = freshState();
  const remap = src => {
    const out = {};
    Object.keys(src || {}).forEach(k => {
      const cut = k.lastIndexOf('#');
      if (cut < 0) return;
      const sid = k.slice(0, cut), idx = k.slice(cut + 1);
      out[/^\d+$/.test(idx) ? sid + '#t' + idx : k] = src[k];
    });
    return out;
  };
  s.conf = remap(old.conf);
  s.done = remap(old.done);
  s.cases = Object.assign({}, old.cases || {});
  Object.keys(old.tasks || {}).forEach(k => {
    const cut = k.lastIndexOf('#');
    if (cut < 0) return;
    s.ticks[k.slice(0, cut) + '#t' + k.slice(cut + 1)] = old.tasks[k];
  });
  return s;
}

async function load() {
  let raw = await store.get(KEY);
  if (raw) {
    try {
      const p = JSON.parse(raw);
      S = Object.assign(freshState(), p);
      S.ui = Object.assign({ theme: null }, p.ui || {});
    } catch (e) { S = freshState(); }
  } else {
    const old = await store.get(OLD_KEY);
    if (old) {
      try { S = migrateV1(JSON.parse(old)); toast('Progress carried over from the old tracker'); }
      catch (e) { S = freshState(); }
    } else {
      S = freshState();
    }
    save();
  }
  if (S.ui.theme) document.documentElement.dataset.theme = S.ui.theme;
  selDate = iso(new Date());
  renderAll();
  startClock();
}

/* ============================================================
   3. HELPERS
   ============================================================ */

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g,
  c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));

const pad2 = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());

function fromISO(s) {
  const p = String(s).split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}
function atTime(dateStr, hhmm) {
  const d = fromISO(dateStr);
  const t = String(hhmm || '00:00').split(':').map(Number);
  d.setHours(t[0] || 0, t[1] || 0, 0, 0);
  return d;
}
const addDays = (dateStr, n) => {
  const d = fromISO(dateStr); d.setDate(d.getDate() + n); return iso(d);
};
const wdayKey = dateStr => WDAYS[fromISO(dateStr).getDay()];
const minsOf = hhmm => {
  const t = String(hhmm || '').split(':').map(Number);
  return (t[0] || 0) * 60 + (t[1] || 0);
};
const subjById = id => S.subjects.filter(s => s.id === id)[0] || null;

function fmtDayLong(dateStr) {
  return fromISO(dateStr).toLocaleDateString('en-GB',
    { weekday:'long', day:'numeric', month:'long' });
}
function fmtHrs(sec) {
  const h = sec / 3600;
  if (h >= 10) return Math.round(h) + 'h';
  return (Math.round(h * 10) / 10) + 'h';
}
function relDay(dateStr) {
  const t = iso(new Date());
  if (dateStr === t) return 'Today';
  if (dateStr === addDays(t, 1)) return 'Tomorrow';
  if (dateStr === addDays(t, -1)) return 'Yesterday';
  const diff = Math.round((fromISO(dateStr) - fromISO(t)) / 864e5);
  return diff > 0 ? 'In ' + diff + ' days' : Math.abs(diff) + ' days ago';
}

/* Resolve a date into { label, gold, examSubject, blocks[], tasks[] } */
function resolveDay(dateStr) {
  const ov = S.days[dateStr] || null;
  const tmplKey = (ov && ov.template) || S.week[wdayKey(dateStr)];
  const tmpl = S.templates[tmplKey];
  const raw = (ov && ov.blocks) ? ov.blocks : (tmpl ? tmpl.blocks : []);
  const examId = ov ? ov.exam : null;
  const deepId = ov ? ov.deep : null;
  const deep2Id = ov ? ov.deep2 : null;

  const blocks = raw.map((b, i) => {
    let sid = b.subj || null;
    if (sid === 'exam') sid = examId;
    else if (sid === 'deep') sid = deepId;
    else if (sid === 'deep2') sid = deep2Id;
    return {
      i: i, from: b.from, to: b.to, label: b.label,
      kind: b.kind, subjectId: sid && subjById(sid) ? sid : null
    };
  }).filter(b => !(b.kind === 'exam' && !b.subjectId));

  return {
    label: (ov && ov.label) || (tmpl ? tmpl.name : ''),
    templateKey: tmplKey,
    gold: !!(ov && ov.gold),
    examSubject: examId ? subjById(examId) : null,
    blocks: blocks,
    tasks: (ov && ov.tasks) || []
  };
}

/* Next paper, aware of the 10:00–13:00 window */
function examStatus() {
  const now = new Date();
  const sorted = S.subjects.slice().sort((a, b) => a.date < b.date ? -1 : 1);
  for (let i = 0; i < sorted.length; i++) {
    const s = sorted[i];
    const start = atTime(s.date, s.examStart || '10:00');
    const end = atTime(s.date, s.examEnd || '13:00');
    if (now >= start && now < end) return { state:'live', subject:s, until:end };
    if (now < start) return { state:'before', subject:s, until:start };
  }
  return { state:'done' };
}

function loggedSeconds(subjectId) {
  let t = 0;
  for (let i = 0; i < S.sessions.length; i++) {
    if (S.sessions[i].subjectId === subjectId) t += S.sessions[i].seconds;
  }
  if (S.running && S.running.subjectId === subjectId) t += runningSeconds();
  return t;
}
function runningSeconds() {
  if (!S.running) return 0;
  return Math.max(0, Math.floor((Date.now() - S.running.startedAt) / 1000));
}
function secondsOnDate(dateStr) {
  let t = 0;
  for (let i = 0; i < S.sessions.length; i++) {
    if (iso(new Date(S.sessions[i].startedAt)) === dateStr) t += S.sessions[i].seconds;
  }
  if (S.running && iso(new Date(S.running.startedAt)) === dateStr) t += runningSeconds();
  return t;
}
function readiness() {
  let tot = 0, max = 0;
  S.subjects.forEach(s => s.topics.forEach(t => {
    tot += (S.conf[s.id + '#' + t.id] || 0); max += 3;
  }));
  return max ? Math.round(tot / max * 100) : 0;
}
function readyCount(s) {
  return s.topics.filter(t => (S.conf[s.id + '#' + t.id] || 0) === 3).length;
}
function plannedSeconds(dateStr) {
  const d = resolveDay(dateStr);
  let t = 0;
  d.blocks.forEach(b => {
    if (b.kind !== 'study' || !b.to) return;
    t += Math.max(0, minsOf(b.to) - minsOf(b.from)) * 60;
  });
  return t;
}

/* ============================================================
   4. MODAL + TOAST
   ============================================================ */

let modalOk = null;
function openModal(cfg) {
  $('modalH').textContent = cfg.title;
  const b = $('modalB');
  let html = cfg.body ? '<p>' + esc(cfg.body) + '</p>' : '';
  (cfg.fields || []).forEach(f => {
    html += '<div class="fld"><label for="f_' + esc(f.key) + '">' + esc(f.label) + '</label>';
    if (f.type === 'select') {
      html += '<select id="f_' + esc(f.key) + '">' +
        f.options.map(o => '<option value="' + esc(o.v) + '"' +
          (String(o.v) === String(f.value) ? ' selected' : '') + '>' + esc(o.t) + '</option>').join('') +
        '</select>';
    } else if (f.type === 'textarea') {
      html += '<textarea id="f_' + esc(f.key) + '">' + esc(f.value || '') + '</textarea>';
    } else {
      html += '<input id="f_' + esc(f.key) + '" type="' + (f.type || 'text') +
        '" value="' + esc(f.value || '') + '" placeholder="' + esc(f.placeholder || '') + '">';
    }
    html += '</div>';
  });
  b.innerHTML = html;

  $('modalF').innerHTML =
    '<button class="btn" data-mx="cancel">Cancel</button>' +
    '<button class="btn ' + (cfg.danger ? 'dgr' : 'pri') + '" data-mx="ok">' +
    esc(cfg.okLabel || 'Save') + '</button>';

  modalOk = function () {
    const vals = {};
    (cfg.fields || []).forEach(f => { const el = $('f_' + f.key); vals[f.key] = el ? el.value : ''; });
    cfg.onOk(vals);
  };
  $('modal').classList.remove('off');
  const first = b.querySelector('input, select, textarea');
  if (first) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 40);
}
function closeModal() { $('modal').classList.add('off'); modalOk = null; }

let toastTimer;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.remove('off');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('off'), 2600);
}

/* ============================================================
   5. RENDER — board + timer
   ============================================================ */

function renderBoard() {
  const st = examStatus();
  const board = $('board');
  const L = $('boardLabel'), V = $('boardTime'), F = $('boardFor');

  if (st.state === 'done') {
    board.classList.remove('live');
    L.textContent = 'Sprint complete';
    V.textContent = 'Done';
    F.textContent = 'All seven papers written';
  } else {
    const ms = st.until - new Date();
    const dd = Math.floor(ms / 864e5), hh = Math.floor(ms / 36e5) % 24, mm = Math.floor(ms / 6e4) % 60;
    if (st.state === 'live') {
      board.classList.add('live');
      L.textContent = 'Exam in progress';
      V.textContent = hh > 0 ? hh + 'h ' + pad2(mm) + 'm left' : mm + 'm left';
      F.textContent = st.subject.name + ' · ends ' + (st.subject.examEnd || '13:00');
    } else {
      board.classList.remove('live');
      L.textContent = 'Next paper in';
      V.textContent = dd > 0 ? dd + 'd ' + hh + 'h ' + pad2(mm) + 'm' : hh + 'h ' + pad2(mm) + 'm';
      F.textContent = st.subject.name + ' · ' +
        fromISO(st.subject.date).toLocaleDateString('en-GB', { day:'numeric', month:'short' }) +
        ' ' + (st.subject.examStart || '10:00');
    }
  }

  const pct = readiness();
  const C = 2 * Math.PI * 21;
  $('ringFill').setAttribute('stroke-dashoffset', String(C * (1 - pct / 100)));
  $('ringNum').textContent = pct + '%';
}

function renderTimer() {
  const bar = $('timerbar');
  if (!S.running) { bar.classList.add('off'); return; }
  bar.classList.remove('off');
  const s = subjById(S.running.subjectId);
  $('tbSub').textContent = s ? s.name : 'Study';
  tickTimer();
}
function tickTimer() {
  if (!S.running) return;
  const t = runningSeconds();
  const h = Math.floor(t / 3600), m = Math.floor(t / 60) % 60, sec = t % 60;
  $('tbTime').textContent = h > 0 ? h + ':' + pad2(m) + ':' + pad2(sec) : m + ':' + pad2(sec);
}

/* ============================================================
   6. RENDER — Day view
   ============================================================ */

function stripRange() {
  const today = iso(new Date());
  const dates = Object.keys(S.days).sort();
  let start = dates.length ? dates[0] : today;
  let end = dates.length ? dates[dates.length - 1] : today;
  /* A week back to catch up on, four weeks forward so the repeating
     weekly plan is worth looking at once the sprint is over. */
  if (addDays(today, -7) < start) start = addDays(today, -7);
  if (addDays(today, 28) > end) end = addDays(today, 28);
  const out = [];
  for (let d = start; d <= end; d = addDays(d, 1)) out.push(d);
  return out;
}

function renderDay() {
  const today = iso(new Date());
  const day = resolveDay(selDate);
  let h = '';

  /* date strip */
  h += '<div class="strip-scroll"><div class="strip">';
  stripRange().forEach(d => {
    const rd = resolveDay(d);
    const dt = fromISO(d);
    const anyDone = rd.blocks.some((b, i) => S.ticks[d + '#b' + b.i]) ||
                    rd.tasks.some((t, i) => S.ticks[d + '#t' + i]);
    h += '<button class="day' + (d === selDate ? ' sel' : '') + (d === today ? ' today' : '') +
      '" data-day="' + d + '" aria-label="' + esc(fmtDayLong(d)) + '">' +
      '<div class="day-w">' + dt.toLocaleDateString('en-GB', { weekday:'short' }) + '</div>' +
      '<div class="day-d">' + dt.getDate() + '</div>' +
      '<div class="day-m">' + dt.toLocaleDateString('en-GB', { month:'short' }) + '</div>' +
      '<div class="day-mark">' +
        (rd.examSubject ? '<i class="exam"></i>' : '') +
        (rd.gold ? '<i class="gold"></i>' : '') +
        (anyDone ? '<i class="dn"></i>' : '') +
      '</div></button>';
  });
  h += '</div></div>';

  /* day header */
  h += '<div class="dayhead"><h2>' + esc(fmtDayLong(selDate)) + '</h2><div style="display:flex;gap:6px;flex-wrap:wrap">';
  h += '<span class="badge' + (day.gold ? ' gold' : '') + '">' + esc(relDay(selDate)) + '</span>';
  if (day.examSubject) h += '<span class="badge exam">' + esc(day.examSubject.name) + '</span>';
  h += '</div></div>';
  if (day.label) h += '<div class="muted" style="margin:-6px 0 14px">' + esc(day.label) + '</div>';

  /* focus now */
  h += renderFocus();

  /* one-off tasks */
  if (day.tasks.length) {
    h += '<div class="eyebrow">Before anything else</div><div class="card pad">';
    day.tasks.forEach((t, i) => {
      const k = selDate + '#t' + i, on = !!S.ticks[k];
      h += '<div class="task' + (on ? ' done' : '') + '">' +
        '<span class="cbwrap"><input type="checkbox" class="box" data-tick="' + esc(k) + '"' +
        (on ? ' checked' : '') + ' aria-label="' + esc(t) + '"></span>' +
        '<span class="task-text">' + esc(t) + '</span>' +
        '<button class="task-x" data-deltask="' + i + '" aria-label="Delete this task">×</button></div>';
    });
    h += '<div class="addrow"><button class="mini" data-addtask="1">+ Add task</button></div></div>';
  }

  /* timeline */
  const planned = plannedSeconds(selDate), actual = secondsOnDate(selDate);
  h += '<div class="eyebrow">Schedule' +
       '<span class="mono" style="text-transform:none;letter-spacing:0;font-size:10px">' +
       fmtHrs(actual) + ' logged / ' + fmtHrs(planned) + ' planned</span>' +
       '<button class="ebtn" data-addblock="1">+ Block</button></div>';

  h += '<div class="card pad"><div class="tl">';
  if (!day.blocks.length) {
    h += '<div class="muted">No blocks for this day. Add one, or set this weekday’s template in Plan.</div>';
  }
  const nowMin = (selDate === today) ? new Date().getHours() * 60 + new Date().getMinutes() : -1;
  day.blocks.forEach((b, idx) => {
    const k = selDate + '#b' + b.i, on = !!S.ticks[k];
    const st = minsOf(b.from);
    const en = b.to ? minsOf(b.to) : st + 30;
    const isNow = nowMin >= st && nowMin < en;
    const isPast = nowMin >= en;
    const sub = b.subjectId ? subjById(b.subjectId) : null;
    h += '<div class="blk ' + esc(b.kind) + (isNow ? ' now' : '') + (isPast && !isNow ? ' past' : '') +
         (on ? ' done' : '') + '">' +
      '<div class="blk-t">' + esc(b.from) + (b.to ? '<span>' + esc(b.to) + '</span>' : '') + '</div>' +
      '<div class="blk-b">' +
        '<label style="display:flex;gap:6px;align-items:flex-start;cursor:pointer">' +
        '<span class="cbwrap" style="margin-top:-8px"><input type="checkbox" class="box" data-tick="' + esc(k) +
        '"' + (on ? ' checked' : '') + ' aria-label="Done: ' + esc(b.label) + '"></span>' +
        '<span class="blk-name">' + esc(b.label) + '</span></label>' +
        '<div class="blk-sub">' +
          (isNow ? '<span class="now-tag">NOW</span>' : '') +
          '<span>' + esc(KIND_LABEL[b.kind] || b.kind) + '</span>' +
          (sub ? '<span>· ' + esc(sub.name) + '</span>' : '') +
        '</div>' +
      '</div>' +
      '<div>' + (sub && b.kind === 'study'
        ? '<button class="blk-go" data-start="' + esc(sub.id) + '">Start</button>' : '') + '</div>' +
    '</div>';
  });
  h += '</div></div>';

  /* habits */
  const hb = S.habits[selDate] || {};
  h += '<div class="eyebrow">Non-negotiables</div><div class="habits">' +
    ['gym','sleep','entrance'].map(k =>
      '<button class="habit' + (hb[k] ? ' on' : '') + '" data-habit="' + k + '"><i></i>' +
      (k === 'gym' ? 'Gym' : k === 'sleep' ? '7+ hrs sleep' : 'Entrance hr') + '</button>').join('') +
    '</div>';

  $('v-day').innerHTML = h;
  const sel = $('v-day').querySelector('.day.sel');
  if (sel && sel.scrollIntoView) sel.scrollIntoView({ block:'nearest', inline:'center' });
}

function renderFocus() {
  const st = examStatus();
  if (st.state === 'done') return '';
  const s = st.subject;
  const scored = s.topics.map(t => ({ t: t, c: S.conf[s.id + '#' + t.id] || 0 }));
  const weak = scored.filter(x => x.c <= 1)
                     .sort((a, b) => a.c - b.c)
                     .slice(0, 5);
  const shakyN = scored.filter(x => x.c === 1).length;
  const untouched = scored.filter(x => x.c === 0).length;
  const days = Math.max(0, Math.round((atTime(s.date, s.examStart) - new Date()) / 864e5));

  let h = '<div class="eyebrow">Focus now</div><div class="card pad focus">';
  if (!weak.length) {
    h += '<div class="focus-line"><b>' + esc(s.name) + '</b> — every topic is at least Getting there. ' +
         'Move to written practice: ' + (S.cases[s.id] || 0) + ' cases so far.</div>';
  } else {
    h += '<div class="focus-line"><b>' + esc(s.name) + '</b> — ' +
      (untouched ? untouched + ' untouched' : '') +
      (untouched && shakyN ? ', ' : '') +
      (shakyN ? shakyN + ' still shaky' : '') +
      '. Paper ' + (days === 0 ? 'today' : days === 1 ? 'tomorrow' : 'in ' + days + ' days') + '.</div>';
    weak.forEach(x => {
      const k = s.id + '#' + x.t.id;
      h += '<div class="frow"><div><div class="frow-name">' + esc(x.t.name) +
        (x.t.star ? ' <span class="star">★</span>' : '') + '</div>' +
        '<div class="frow-sub">' + (x.c === 0 ? 'Not started' : 'Shaky') + '</div></div>' +
        '<div class="pills">' + confPills(k, x.c) + '</div></div>';
    });
  }
  h += '</div>';
  return h;
}

function confPills(key, c) {
  return [[1,'Shaky'],[2,'Getting there'],[3,'Ready']].map(p =>
    '<button class="pill' + (c === p[0] ? ' on' : '') + '" data-v="' + p[0] +
    '" data-conf="' + esc(key) + '">' + p[1] + '</button>').join('');
}

/* ============================================================
   7. RENDER — Papers
   ============================================================ */

function renderPapers() {
  const today = iso(new Date());
  const st = examStatus();
  let h = '<div class="eyebrow">Seven papers</div>';

  S.subjects.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach((s, i) => {
    const sat = s.date < today;
    const isNext = st.state !== 'done' && st.subject.id === s.id;
    const segs = s.topics.map(t =>
      '<span class="seg s' + (S.conf[s.id + '#' + t.id] || 0) + '"></span>').join('');
    const logged = loggedSeconds(s.id);
    const budgetSec = (s.budget || 0) * 3600;
    const pct = budgetSec ? Math.min(100, Math.round(logged / budgetSec * 100)) : 0;
    const open = openId === s.id;
    const editing = editingSubject === s.id;

    h += '<div class="paper' + (open ? ' open' : '') + (isNext ? ' next' : '') + (sat ? ' sat' : '') +
      '" style="animation-delay:' + (i * 35) + 'ms">' +
      '<button class="paper-row" data-open="' + esc(s.id) + '" aria-expanded="' + open + '">' +
        '<span class="p-date">' + fromISO(s.date).toLocaleDateString('en-GB', { weekday:'short' }) +
          '<br>' + fromISO(s.date).toLocaleDateString('en-GB', { day:'2-digit', month:'short' }).toUpperCase() + '</span>' +
        '<span style="min-width:0"><span class="p-name">' + esc(s.name) + '</span>' +
          '<span class="p-meta">' + readyCount(s) + '/' + s.topics.length + ' ready · ' +
          fmtHrs(logged) + '/' + (s.budget || 0) + 'h · ' + esc(s.level || '') + '</span></span>' +
        '<span class="p-right"><span class="segbar">' + segs + '</span>' +
          (isNext ? '<span class="badge">NEXT</span>' : '<span class="chev">›</span>') + '</span>' +
      '</button>' +
      '<div class="panel">';

    h += '<div class="budget"><div class="budget-top">' +
      '<span class="budget-lab">Hours logged</span>' +
      '<span class="budget-num">' + fmtHrs(logged) + ' / ' + (s.budget || 0) + 'h</span></div>' +
      '<div class="bar"><i class="' + (logged > budgetSec ? 'over' : '') +
      '" style="width:' + pct + '%"></i></div>' +
      '<div class="muted" style="font-size:12px;margin-top:6px">' + esc(s.why || '') + '</div></div>';

    h += '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:10px 0">' +
      '<button class="mini" data-start="' + esc(s.id) + '">▶ Start timer</button>' +
      '<button class="mini" data-editsubj="' + esc(s.id) + '">' + (editing ? 'Done editing' : 'Edit') + '</button>' +

    h += '<div class="panel-head"><span>Framework card built</span><span>Confidence</span></div>';
    s.topics.forEach(t => {
      const k = s.id + '#' + t.id, c = S.conf[k] || 0;
      h += '<div class="topic' + (S.done[k] ? ' done' : '') + '">' +
        '<span class="cbwrap"><input type="checkbox" class="box" data-done="' + esc(k) + '"' +
          (S.done[k] ? ' checked' : '') + ' aria-label="Card built: ' + esc(t.name) + '"></span>' +
        '<span class="topic-name">' + esc(t.name) + (t.star ? ' <span class="star">★</span>' : '') + '</span>' +
        '<span class="pills">' + confPills(k, c) + '</span>' +
        (editing ? '<span class="topic-edit">' +
          '<button class="mini" data-rentopic="' + esc(s.id + '|' + t.id) + '">Rename</button>' +
          '<button class="mini" data-startopic="' + esc(s.id + '|' + t.id) + '">' + (t.star ? 'Unstar' : 'Star') + '</button>' +
          '<button class="mini" data-uptopic="' + esc(s.id + '|' + t.id) + '">↑</button>' +
          '<button class="mini danger" data-deltopic="' + esc(s.id + '|' + t.id) + '">Delete</button>' +
          '</span>' : '') +

    });

    h += '<div class="cases">' +
      '<span class="cases-label"><b>Cases attempted</b> — write the answer yourself first, then get it marked</span>' +
      '<span class="counter">' +
        '<button class="cbtn" data-case="' + esc(s.id) + '" data-d="-1" aria-label="One fewer case">−</button>' +
        '<span class="cnum">' + (S.cases[s.id] || 0) + '</span>' +
        '<button class="cbtn" data-case="' + esc(s.id) + '" data-d="1" aria-label="One more case">+</button>' +
      '</span></div>';

    h += '</div></div>';
  });

  h += '<div class="addrow"><button class="mini" data-addsubj="1">+ Add paper</button></div>';
  $('v-papers').innerHTML = h;
}

        '<option value="' + esc(k) + '"' + (S.week[d] === k ? ' selected' : '') + '>' +

/* ============================================================
   9. RENDER — Stats
   ============================================================ */

function renderStats() {
  const totalSec = S.sessions.reduce((a, s) => a + s.seconds, 0) + runningSeconds();
  const totalBudget = S.subjects.reduce((a, s) => a + (s.budget || 0), 0);
  const cases = S.subjects.reduce((a, s) => a + (S.cases[s.id] || 0), 0);
  const cardsBuilt = Object.keys(S.done).filter(k => S.done[k]).length;
  const totalTopics = S.subjects.reduce((a, s) => a + s.topics.length, 0);

  let h = '<div class="eyebrow">Where you stand</div><div class="stat-grid">' +
    stat('Overall readiness', readiness() + '%', 'across ' + totalTopics + ' topics') +
    stat('Hours logged', fmtHrs(totalSec), 'of ' + totalBudget + 'h budgeted') +
    stat('Cases written', String(cases), 'answers you drafted yourself') +
    stat('Cards built', cardsBuilt + '/' + totalTopics, 'framework cards') +
    '</div>';

  h += '<div class="eyebrow">Hours against budget</div><div class="card pad">';
  S.subjects.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(s => {
    const lg = loggedSeconds(s.id), bud = (s.budget || 0) * 3600;
    const pct = bud ? Math.min(100, Math.round(lg / bud * 100)) : 0;
    h += '<div class="srow"><div class="srow-top">' +
      '<span class="srow-n">' + esc(s.name) + '</span>' +
      '<span class="srow-v">' + fmtHrs(lg) + ' / ' + (s.budget || 0) + 'h</span></div>' +
      '<div class="bar"><i class="' + (lg > bud ? 'over' : '') + '" style="width:' + pct + '%"></i></div></div>';
  });
  h += '</div>';

  h += '<div class="eyebrow">Confidence spread</div><div class="card pad">';
  S.subjects.slice().sort((a, b) => a.date < b.date ? -1 : 1).forEach(s => {
    const n = s.topics.length || 1;
    const cnt = [0,0,0,0];
    s.topics.forEach(t => cnt[S.conf[s.id + '#' + t.id] || 0]++);
    h += '<div class="srow"><div class="srow-top">' +
      '<span class="srow-n">' + esc(s.name) + '</span>' +
      '<span class="srow-v">' + cnt[3] + '/' + s.topics.length + ' ready</span></div>' +
      '<div class="spread">' + [0,1,2,3].map(c =>
        cnt[c] ? '<i class="c' + c + '" style="width:' + (cnt[c] / n * 100) + '%"></i>' : '').join('') +
      '</div></div>';
  });
  h += '<div class="legend">' +
    '<span class="lg"><i style="background:var(--rule)"></i>Not started</span>' +
    '<span class="lg"><i style="background:var(--shaky)"></i>Shaky</span>' +
    '<span class="lg"><i style="background:var(--mid)"></i>Getting there</span>' +
    '<span class="lg"><i style="background:var(--ready)"></i>Ready</span></div></div>';

  /* last 10 days of logged time */
  const today = iso(new Date());
  const days = [];
  for (let i = 9; i >= 0; i--) days.push(addDays(today, -i));
  const maxSec = Math.max.apply(null, days.map(secondsOnDate).concat([3600]));
  h += '<div class="eyebrow">Last ten days</div><div class="card pad">';
  days.forEach(d => {
    const sec = secondsOnDate(d);
    h += '<div class="srow"><div class="srow-top">' +
      '<span class="srow-n">' + esc(fromISO(d).toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })) +
      (d === today ? ' · today' : '') + '</span>' +
      '<span class="srow-v">' + (sec ? fmtHrs(sec) : '—') + '</span></div>' +
      '<div class="bar"><i style="width:' + Math.round(sec / maxSec * 100) + '%"></i></div></div>';
  });
  h += '</div>';

  /* Sessions are editable: a timer left running overnight would otherwise
     skew a subject's budget with no way back short of clearing everything. */
  h += '<div class="eyebrow">Logged sessions</div><div class="card pad">';
  if (!S.sessions.length) {
    h += '<div class="muted">Nothing logged yet. Hit Start on a study block and it lands here.</div>';
  } else {
    S.sessions.slice().sort((a, b) => b.startedAt - a.startedAt).slice(0, 12).forEach(ss => {
      const sub = subjById(ss.subjectId);
      const when = new Date(ss.startedAt);
      h += '<div class="srow"><div class="srow-top">' +
        '<span class="srow-n">' + esc(sub ? sub.name : 'Deleted paper') + '</span>' +
        '<span class="srow-v">' + fmtHrs(ss.seconds) +
          ' <button class="task-x" data-delsession="' + esc(ss.id) +
          '" aria-label="Delete this session">×</button></span></div>' +
        '<div class="muted" style="font-size:11.5px">' +
          esc(when.toLocaleDateString('en-GB', { weekday:'short', day:'numeric', month:'short' })) +
          ' · ' + pad2(when.getHours()) + ':' + pad2(when.getMinutes()) + '</div></div>';
    });
    if (S.sessions.length > 12) {
      h += '<div class="muted" style="margin-top:8px;font-size:12px">' +
        (S.sessions.length - 12) + ' older session' + (S.sessions.length - 12 > 1 ? 's' : '') +
        ' not shown.</div>';
    }
  }
  h += '</div>';

  h += '<div class="eyebrow">Your data</div><div class="card pad">' +
    '<div class="muted" style="margin-bottom:12px">Everything is stored in this browser on this device. ' +
    'Save a backup before clearing anything, and to move your progress to another device.</div>' +
    '<div class="addrow">' +
    '<button class="mini" data-export="1">Save backup</button>' +
    '<button class="mini" data-import="1">Restore backup</button>' +
    '<button class="mini danger" data-reset="1">Clear everything</button>' +
    '<input type="file" id="fileIn" accept="application/json,.json" hidden></div></div>' +
    '<div class="foot-note">Mid-Term Sprint · IPM 06 · Term VII<br>Seven papers, 28 July – 4 August</div>';

  $('v-stats').innerHTML = h;
}

function stat(l, v, s) {
  return '<div class="stat"><div class="stat-l">' + esc(l) + '</div>' +
    '<div class="stat-v">' + esc(v) + '</div>' +
    '<div class="stat-s">' + esc(s) + '</div></div>';
}

function renderAll() {
  renderBoard();
  renderTimer();
  if (view === 'day') renderDay();
  else if (view === 'papers') renderPapers();
  else if (view === 'plan') renderPlan();
  else renderStats();
}
function refresh() { save(); renderAll(); }

function setView(v) {
  view = v;
  const views = { day:'v-day', papers:'v-papers', plan:'v-plan', stats:'v-stats' };
  Object.keys(views).forEach(k => $(views[k]).classList.toggle('on', k === v));
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), b => {
    const on = b.dataset.tab === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-selected', String(on));
  });
  renderAll();
  window.scrollTo(0, 0);
}

/* ============================================================
   11. TIMER
   ============================================================ */

function startTimer(subjectId) {
  if (S.running) stopTimer(true);
  S.running = { subjectId: subjectId, startedAt: Date.now() };
  const s = subjById(subjectId);
  toast('Timer started — ' + (s ? s.name : 'study'));
  refresh();
}
function stopTimer(quiet) {
  if (!S.running) return;
  const sec = runningSeconds();
  if (sec >= 20) {
    S.sessions.push({ id:'s' + Date.now(), subjectId:S.running.subjectId,
                      startedAt:S.running.startedAt, seconds:sec });
  }
  const s = subjById(S.running.subjectId);
  S.running = null;
  if (!quiet) toast(sec < 20 ? 'Too short to log' : 'Logged ' + fmtHrs(sec) + ' on ' + (s ? s.name : 'study'));
  refresh();
}

/* ============================================================
   12. BACKUP
   ============================================================ */

async function doExport() {
  const data = JSON.stringify(S, null, 2);
  const name = 'midsem-progress-' + iso(new Date()) + '.json';
  if (window.claude && window.claude.downloads && window.claude.downloads.save) {
    try {
      await window.claude.downloads.save({ filename: name, data: data });
      toast('Backup saved');
      return;
    } catch (e) {
      toast('Save was declined');
      return;
    }
  }
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([data], { type:'application/json' }));
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
    toast('Backup saved');
  } catch (e) {
    toast('Could not save the backup here');
  }
}

function validState(o) {
  return o && typeof o === 'object' &&
    Array.isArray(o.subjects) && o.subjects.length &&
    o.subjects.every(s => s && s.id && Array.isArray(s.topics)) &&
    o.templates && typeof o.templates === 'object' &&
    o.week && typeof o.week === 'object';
}

function doImport(file) {
  const r = new FileReader();
  r.onload = () => {
    let p;
    try { p = JSON.parse(r.result); }
    catch (e) { toast('That file is not valid JSON'); return; }

    if (p && p.conf && !p.subjects) {           /* an old v1 backup */
      S = migrateV1(p); refresh();
      toast('Restored from an old backup');
      return;
    }
    if (!validState(p)) { toast('That backup is missing its papers — pick another file'); return; }
    S = Object.assign(freshState(), p);
    S.ui = Object.assign({ theme:null }, p.ui || {});
    refresh();
    toast('Backup restored');
  };
  r.onerror = () => toast('That file could not be read');
  r.readAsText(file);
}

/* ============================================================
   13. EVENTS
   ============================================================ */

const KIND_OPTS = Object.keys(KIND_LABEL).map(k => ({ v:k, t:KIND_LABEL[k] }));
function subjOpts(includeRefs) {
  let o = [{ v:'', t:'— none —' }];
  if (includeRefs) o = o.concat([
    { v:'exam',  t:"That day's exam subject" },
    { v:'deep',  t:'Primary subject that day' },
    { v:'deep2', t:'Second subject that day' }]);
  return o.concat(S.subjects.map(s => ({ v:s.id, t:s.name })));
}

document.addEventListener('click', e => {
  const T = e.target;

  /* modal */
  const mx = T.closest('[data-mx]');
  if (mx) {
    if (mx.dataset.mx === 'ok' && modalOk) modalOk();
    closeModal();
    return;
  }
  if (T.id === 'modal') { closeModal(); return; }

  /* tabs */
  const tab = T.closest('[data-tab]');
  if (tab) { setView(tab.dataset.tab); return; }

  /* theme */
  if (T.closest('#btnTheme')) {
    const cur = document.documentElement.dataset.theme ||
      (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = next;
    S.ui.theme = next; save();
    return;
  }

  /* timer */
  if (T.closest('#tbStop')) { stopTimer(); return; }
  const go = T.closest('[data-start]');
  if (go) { startTimer(go.dataset.start); return; }

  /* day strip */
  const d = T.closest('[data-day]');
  if (d) { selDate = d.dataset.day; renderDay(); return; }

  /* confidence */
  const p = T.closest('[data-conf]');
  if (p) {
    const k = p.dataset.conf, v = +p.dataset.v;
    S.conf[k] = S.conf[k] === v ? 0 : v;
    refresh(); return;
  }

  /* cases */
  const c = T.closest('[data-case]');
  if (c) {
    const id = c.dataset.case;
    S.cases[id] = Math.max(0, (S.cases[id] || 0) + (+c.dataset.d));
    refresh(); return;
  }

  /* habits */
  const hb = T.closest('[data-habit]');
  if (hb) {
    const cur = S.habits[selDate] || (S.habits[selDate] = {});
    cur[hb.dataset.habit] = !cur[hb.dataset.habit];
    refresh(); return;
  }

  /* papers: open / edit */
  const o = T.closest('[data-open]');
  if (o) { openId = openId === o.dataset.open ? null : o.dataset.open; renderPapers(); return; }

  const ed = T.closest('[data-editsubj]');
  if (ed) {
    editingSubject = editingSubject === ed.dataset.editsubj ? null : ed.dataset.editsubj;
    renderPapers(); return;
  }

  /* ---- day: tasks ---- */
  if (T.closest('[data-addtask]')) {
    openModal({ title:'Add a task for ' + fmtDayLong(selDate),
      fields:[{ key:'t', label:'Task', value:'', placeholder:'What needs doing' }],
      onOk: v => {
        if (!v.t.trim()) return;
        const day = S.days[selDate] || (S.days[selDate] = {});
        if (!day.tasks) day.tasks = [];
        day.tasks.push(v.t.trim());
        refresh();
      } });
    return;
  }
  const dt = T.closest('[data-deltask]');
  if (dt) {
    const day = S.days[selDate];
    if (day && day.tasks) { day.tasks.splice(+dt.dataset.deltask, 1); refresh(); }
    return;
  }

  /* ---- day: add a one-off block ---- */
  if (T.closest('[data-addblock]')) {
    openModal({ title:'Add a block to ' + fmtDayLong(selDate),
      body:'This changes only this date, not the weekly template.',
      fields:[
        { key:'from', label:'From', value:'09:00', type:'time' },
        { key:'to',   label:'To',   value:'11:00', type:'time' },
        { key:'label',label:'What', value:'', placeholder:'Deep work on…' },
        { key:'kind', label:'Kind', type:'select', value:'study', options:KIND_OPTS },
        { key:'subj', label:'Subject', type:'select', value:'', options:subjOpts(false) }],
      onOk: v => {
        if (!v.label.trim()) return;
        const day = S.days[selDate] || (S.days[selDate] = {});
        if (!day.blocks) day.blocks = resolveDay(selDate).blocks.map(b => ({
          from:b.from, to:b.to, label:b.label, kind:b.kind, subj:b.subjectId || null }));
        day.blocks.push({ from:v.from, to:v.to, label:v.label.trim(), kind:v.kind, subj:v.subj || null });
        day.blocks.sort((a, b) => minsOf(a.from) - minsOf(b.from));
        refresh();
      } });
    return;
  }

  /* ---- plan: templates ---- */
  if (T.closest('[data-addtmpl]')) {
    openModal({ title:'New day template',
      fields:[{ key:'n', label:'Name', value:'', placeholder:'e.g. Light day' }],
      onOk: v => {
        if (!v.n.trim()) return;
        S.templates['t' + Date.now()] = { name:v.n.trim(), blocks:[] };
        refresh();
      } });
    return;
  }
  const rt = T.closest('[data-rentmpl]');
  if (rt) {
    const k = rt.dataset.rentmpl;
    openModal({ title:'Rename template',
      fields:[{ key:'n', label:'Name', value:S.templates[k].name }],
      onOk: v => { if (v.n.trim()) { S.templates[k].name = v.n.trim(); refresh(); } } });
    return;
  }
  const dtm = T.closest('[data-deltmpl]');
  if (dtm) {
    const k = dtm.dataset.deltmpl;
    openModal({ title:'Delete “' + S.templates[k].name + '”?', danger:true, okLabel:'Delete',
      body:'Any weekday using it falls back to the first remaining template.',
      onOk: () => {
        delete S.templates[k];
        const first = Object.keys(S.templates)[0];
        Object.keys(S.week).forEach(d => { if (S.week[d] === k) S.week[d] = first; });
        refresh();
      } });
    return;
  }
  const atb = T.closest('[data-addtb]');
  if (atb) {
    const k = atb.dataset.addtb;
    openModal({ title:'Add block to ' + S.templates[k].name,
      fields:[
        { key:'from', label:'From', value:'09:00', type:'time' },
        { key:'to',   label:'To',   value:'11:00', type:'time' },
        { key:'label',label:'What', value:'', placeholder:'Deep work…' },
        { key:'kind', label:'Kind', type:'select', value:'study', options:KIND_OPTS },
        { key:'subj', label:'Subject', type:'select', value:'deep', options:subjOpts(true) }],
      onOk: v => {
        if (!v.label.trim()) return;
        S.templates[k].blocks.push({ from:v.from, to:v.to, label:v.label.trim(),
                                     kind:v.kind, subj:v.subj || null });
        S.templates[k].blocks.sort((a, b) => minsOf(a.from) - minsOf(b.from));
        refresh();
      } });
    return;
  }
  const etb = T.closest('[data-edittb]');
  if (etb) {
    const parts = etb.dataset.edittb.split('|'), k = parts[0], i = +parts[1];
    const b = S.templates[k].blocks[i];
    openModal({ title:'Edit block',
      fields:[
        { key:'from', label:'From', value:b.from, type:'time' },
        { key:'to',   label:'To',   value:b.to || '', type:'time' },
        { key:'label',label:'What', value:b.label },
        { key:'kind', label:'Kind', type:'select', value:b.kind, options:KIND_OPTS },
        { key:'subj', label:'Subject', type:'select', value:b.subj || '', options:subjOpts(true) }],
      onOk: v => {
        if (!v.label.trim()) return;
        S.templates[k].blocks[i] = { from:v.from, to:v.to, label:v.label.trim(),
                                     kind:v.kind, subj:v.subj || null };
        S.templates[k].blocks.sort((a, b2) => minsOf(a.from) - minsOf(b2.from));
        refresh();
      } });
    return;
  }
  const dtb = T.closest('[data-deltb]');
  if (dtb) {
    const parts = dtb.dataset.deltb.split('|');
    S.templates[parts[0]].blocks.splice(+parts[1], 1);
    refresh(); return;
  }

  /* ---- papers: subjects & topics ---- */
  if (T.closest('[data-addsubj]')) {
    openModal({ title:'Add a paper',
      fields:[
        { key:'n', label:'Name', value:'', placeholder:'Subject name' },
        { key:'d', label:'Exam date', value:iso(new Date()), type:'date' },
        { key:'b', label:'Hour budget', value:'5', type:'number' }],
      onOk: v => {
        if (!v.n.trim()) return;
        S.subjects.push({ id:'s' + Date.now(), name:v.n.trim(), date:v.d,
          examStart:'10:00', examEnd:'13:00', level:'', budget:+v.b || 0,
          note:'', why:'', aiTip:'', topics:[] });
        refresh();
      } });
    return;
  }
  const sm = T.closest('[data-subjmeta]');
  if (sm) {
    const s = subjById(sm.dataset.subjmeta);
    openModal({ title:'Edit ' + s.name,
      fields:[
        { key:'n', label:'Name', value:s.name },
        { key:'d', label:'Exam date', value:s.date, type:'date' },
        { key:'s', label:'Starts', value:s.examStart || '10:00', type:'time' },
        { key:'e', label:'Ends', value:s.examEnd || '13:00', type:'time' },
        { key:'b', label:'Hour budget', value:String(s.budget || 0), type:'number' },
        { key:'l', label:'Your level', value:s.level || '' }],
      onOk: v => {
        if (!v.n.trim()) return;
        s.name = v.n.trim(); s.date = v.d; s.examStart = v.s; s.examEnd = v.e;
        s.budget = +v.b || 0; s.level = v.l;
        refresh();
      } });
    return;
  }
  const ds = T.closest('[data-delsubj]');
  if (ds) {
    const s = subjById(ds.dataset.delsubj);
    openModal({ title:'Delete ' + s.name + '?', danger:true, okLabel:'Delete',
      body:'Its topics, confidence levels and case count go with it. Logged hours stay in your totals.',
      onOk: () => {
        S.subjects = S.subjects.filter(x => x.id !== s.id);
        if (openId === s.id) openId = null;
        editingSubject = null;
        refresh();
      } });
    return;
  }
  const at = T.closest('[data-addtopic]');
  if (at) {
    const s = subjById(at.dataset.addtopic);
    openModal({ title:'Add topic to ' + s.name,
      fields:[{ key:'n', label:'Topic', value:'', placeholder:'What you need to know' }],
      onOk: v => {
        if (!v.n.trim()) return;
        s.topics.push({ id:'t' + Date.now(), name:v.n.trim(), star:false });
        refresh();
      } });
    return;
  }
  const rtp = T.closest('[data-rentopic]');
  if (rtp) {
    const parts = rtp.dataset.rentopic.split('|');
    const s = subjById(parts[0]), t = s.topics.filter(x => x.id === parts[1])[0];
    openModal({ title:'Rename topic',
      fields:[{ key:'n', label:'Topic', value:t.name }],
      onOk: v => { if (v.n.trim()) { t.name = v.n.trim(); refresh(); } } });
    return;
  }
  const stp = T.closest('[data-startopic]');
  if (stp) {
    const parts = stp.dataset.startopic.split('|');
    const s = subjById(parts[0]), t = s.topics.filter(x => x.id === parts[1])[0];
    t.star = !t.star; refresh(); return;
  }
  const utp = T.closest('[data-uptopic]');
  if (utp) {
    const parts = utp.dataset.uptopic.split('|');
    const s = subjById(parts[0]);
    const i = s.topics.map(x => x.id).indexOf(parts[1]);
    if (i > 0) { const m = s.topics.splice(i, 1)[0]; s.topics.splice(i - 1, 0, m); refresh(); }
    return;
  }
  const dtp = T.closest('[data-deltopic]');
  if (dtp) {
    const parts = dtp.dataset.deltopic.split('|');
    const s = subjById(parts[0]), t = s.topics.filter(x => x.id === parts[1])[0];
    openModal({ title:'Delete “' + t.name + '”?', danger:true, okLabel:'Delete',
      onOk: () => {
        s.topics = s.topics.filter(x => x.id !== t.id);
        delete S.conf[s.id + '#' + t.id];
        delete S.done[s.id + '#' + t.id];
        refresh();
      } });
    return;
  }

  const dss = T.closest('[data-delsession]');
  if (dss) {
    const id = dss.dataset.delsession;
    const ss = S.sessions.filter(x => x.id === id)[0];
    openModal({ title:'Delete this session?', danger:true, okLabel:'Delete',
      body: ss ? fmtHrs(ss.seconds) + ' comes off ' +
        ((subjById(ss.subjectId) || {}).name || 'that paper') + '.' : '',
      onOk: () => { S.sessions = S.sessions.filter(x => x.id !== id); refresh(); } });
    return;
  }

  /* ---- data ---- */
  if (T.closest('[data-export]')) { doExport(); return; }
  if (T.closest('[data-import]')) { $('fileIn').click(); return; }
  if (T.closest('[data-reset]')) {
    openModal({ title:'Clear everything?', danger:true, okLabel:'Clear everything',
      body:'Every tick, confidence level, logged hour and case count goes, and your papers and templates reset to the original plan. This cannot be undone.',
      onOk: () => { S = freshState(); openId = null; editingSubject = null; refresh(); toast('Everything cleared'); } });
    return;
  }
});

document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset && t.dataset.tick) {
    S.ticks[t.dataset.tick] = t.checked; refresh(); return;
  }
  if (t.dataset && t.dataset.done) {
    S.done[t.dataset.done] = t.checked; refresh(); return;
  }
  if (t.dataset && t.dataset.week) {
    S.week[t.dataset.week] = t.value; refresh(); return;
  }
  if (t.id === 'fileIn') {
    const f = t.files && t.files[0];
    if (f) doImport(f);
    t.value = '';
    return;
  }
});

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && !$('modal').classList.contains('off')) closeModal();
  if (e.key === 'Enter' && !$('modal').classList.contains('off')) {
    const tag = (document.activeElement && document.activeElement.tagName) || '';
    if (tag !== 'TEXTAREA') { if (modalOk) modalOk(); closeModal(); }
  }
});

/* ============================================================
   14. CLOCK
   ============================================================ */

let lastMinute = -1;
function startClock() {
  setInterval(() => {
    if (S.running) tickTimer();
    const m = new Date().getMinutes();
    if (m !== lastMinute) {
      lastMinute = m;
      renderBoard();
      if (view === 'day' && selDate === iso(new Date())) renderDay();
    }
  }, 1000);
}

/* go */
load();

})();
</script>

<script>
if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
